// Compose compiler stability configuration (wired in build.gradle.kts → composeCompiler).
//
// The API models in data/Models.kt are immutable data classes (all `val`, produced by
// kotlinx.serialization or copy()), but their List fields make the compiler infer them
// unstable. Declaring them stable lets composables taking them skip via equals()
// instead of only on instance identity. Keep this list to immutable value types only —
// AttachmentInput is deliberately absent (it carries a mutable ByteArray).
