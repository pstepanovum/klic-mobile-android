name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # app/build.gradle.kts targets Java 17 (compileOptions + jvmTarget = "17").
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # Debug builds need no secrets: google-services.json is committed and the
      # release keystore (~/.klic-android/) is only used for release signing.
      - name: Build, unit test, and compile the Play flavor
        run: ./gradlew :app:assembleGithubDebug :app:testGithubDebugUnitTest :app:compilePlayDebugKotlin
